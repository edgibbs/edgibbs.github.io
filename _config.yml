# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Musings of a Software Development Manager
email: ed@edgibbs.com
description: >- # this means to ignore newlines until "baseurl:"
  lessons learned managing developers
baseurl: "" # the subpath of your site, e.g. /blog
url: https://edgibbs.com  # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: edward_gibbs
github_username: edgibbs
mastodon_username: edgibbs
linkedin_username: edwardgibbs
logo: /images/avatar.jpg
author:
  name: Ed Gibbs
  twitter: edward_gibbs
  picture: /images/ed_headshot.jpg

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-include-cache
paginate: 5
paginate_path: /page:num/
show_drafts: false
sass:
  sass_dir: assets/stylesheets
# Exclude from processing. Jekyll appends its own defaults (Gemfile, vendor/,
# node_modules, ...) to whatever is listed here, so only the extras belong below.
# Without these, Jekyll copies front-matter-less files verbatim into the build
# and serves them, e.g. https://edgibbs.com/list-categories.rb
exclude:
  - new-post.rb
  - list-categories.rb
  - spec
  - README.md
