# Stage 1 of the Pages migration: prove the artifact build works without
# deploying anything.
#
# Deliberately inert:
#   - workflow_dispatch only, so it never fires on push
#   - no actions/configure-pages, so nothing reads or writes Pages settings
#   - no actions/deploy-pages, so nothing is ever published
#   - default permissions only; uploading an artifact needs no pages: write
#
# The live pipeline in jekyll.yml is untouched and keeps deploying as usual.
# Delete this file once the migration is decided either way.

name: Test Pages Artifact

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0
          bundler-cache: true

      - name: Build site
        run: JEKYLL_ENV=production bundle exec jekyll build

      - name: Summarise the build
        run: |
          {
            echo "### Pages artifact contents"
            echo
            echo "| Check | Value |"
            echo "| --- | --- |"
            echo "| HTML pages | $(find _site -name '*.html' | wc -l) |"
            echo "| Total files | $(find _site -type f | wc -l) |"
            echo "| CNAME | $(cat _site/CNAME 2>/dev/null || echo 'MISSING') |"
            echo "| index.html | $(test -f _site/index.html && echo present || echo 'MISSING') |"
            echo "| feed.xml | $(test -f _site/feed.xml && echo present || echo 'MISSING') |"
            echo "| Ruby | $(ruby -v) |"
            echo
            echo "Compare against the \`master\` branch, which is what Pages serves today."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
