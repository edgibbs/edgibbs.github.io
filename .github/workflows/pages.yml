# Publishes the site to GitHub Pages from a build artifact.
#
# This is the only deploy pipeline. Pages runs with build_type=workflow, so the
# live site is whatever deployment this workflow last published. There is no
# generated branch behind it.
#
# The failure mode is mild: Pages deployments are immutable, so if a run fails
# the previous deployment keeps serving. The site goes stale, not down.
#
# There is no one-command rollback any more — the generated `master` branch was
# deleted once this proved out. Falling back to branch-serving would mean
# rebuilding that branch by hand first, then setting build_type=legacy.

name: Deploy Pages

on:
  push:
    branches: [ development ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0
          bundler-cache: true

      - name: Build site
        run: JEKYLL_ENV=production bundle exec jekyll build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
